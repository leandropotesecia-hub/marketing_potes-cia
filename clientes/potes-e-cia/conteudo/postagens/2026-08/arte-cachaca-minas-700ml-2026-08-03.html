<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Garrafa Cachaça Minas 700ml</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .impact {
    font-family: 'Arial Black', 'Segoe UI', Arial, sans-serif;
    font-weight: 900;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0b1a2e;
    color: #ffffff;
    overflow: hidden;
  }

  .side-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 18px;
    height: 100%;
    background: #e8a920;
  }

  .stripes {
    position: absolute;
    right: -120px;
    top: -120px;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,169,32,0.14) 0%, rgba(232,169,32,0) 70%);
  }

  .content {
    position: absolute;
    left: 90px;
    right: 90px;
    top: 200px;
  }

  .kicker {
    font-size: 26px;
    font-weight: 700;
    color: #e8a920;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .title {
    margin-top: 18px;
    font-size: 92px;
    line-height: 1.02;
    text-transform: uppercase;
    letter-spacing: -1px;
  }

  .title .accent {
    color: #e8a920;
  }

  .subtitle {
    margin-top: 40px;
    font-size: 40px;
    line-height: 1.2;
    color: #ffffff;
    max-width: 780px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .divider {
    margin-top: 40px;
    width: 90px;
    height: 6px;
    background: #e8a920;
  }

  .badge-stack {
    position: absolute;
    left: 90px;
    top: 800px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }

  .ref-text {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    opacity: 0.85;
  }

  .badge-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #e8a920;
    color: #0b1a2e;
    font-size: 24px;
    font-weight: 900;
    padding: 14px 22px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="side-bar"></div>
    <div class="stripes"></div>

    <div class="content">
      <div class="kicker impact">Pra quem produz artesanal</div>
      <div class="title impact">Cachaça<br>Minas<br><span class="accent">700ml</span></div>
      <div class="subtitle impact">Padrão grande pra produção pequena</div>
      <div class="divider"></div>
    </div>

    <div class="badge-stack">
      <div class="ref-text">Ref.: 157 - 700 ml</div>
      <div class="badge-box">
        <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="12,2 21,7 12,12 3,7" fill="#0b1a2e"/><polygon points="3,7 12,12 12,22 3,17" fill="#0b1a2e" opacity="0.7"/><polygon points="21,7 12,12 12,22 21,17" fill="#0b1a2e" opacity="0.85"/></svg>
        Caixa c/ 12
      </div>
    </div>
  </div>
</body>
</html>
