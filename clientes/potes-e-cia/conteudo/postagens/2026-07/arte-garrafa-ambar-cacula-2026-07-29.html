<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Garrafa Âmbar Caçula</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .impact {
    font-family: 'Arial Black', 'Segoe UI', Arial, sans-serif;
    font-weight: 900;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0b1a2e;
    color: #ffffff;
    overflow: hidden;
  }

  .bg-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.62) saturate(0.85);
  }

  .bg-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(6,10,18,0.55) 0%, rgba(6,10,18,0.05) 30%, rgba(6,10,18,0.1) 55%, rgba(6,10,18,0.7) 100%);
  }

  .bottle {
    position: absolute;
    left: 60px;
    bottom: 40px;
    height: 980px;
    filter: drop-shadow(0 20px 24px rgba(0,0,0,0.6));
  }

  .text-block {
    position: absolute;
    top: 80px;
    right: 60px;
    text-align: right;
    max-width: 560px;
  }

  .text-block .kicker {
    font-size: 22px;
    font-weight: 700;
    color: #e8a920;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .text-block .name {
    margin-top: 8px;
    font-size: 54px;
    line-height: 1.02;
    text-transform: uppercase;
    letter-spacing: -0.5px;
  }

  .text-block .name .accent {
    color: #e8a920;
  }

  .badge-stack {
    position: absolute;
    right: 60px;
    bottom: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .ref-text {
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  .price-badge {
    width: 220px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 18px rgba(0,0,0,0.4);
  }

  .price-badge .row-label {
    background: #0b1a2e;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    padding: 8px 0;
  }

  .price-badge .row-value {
    background: #e8a920;
    color: #ffffff;
    text-align: center;
    padding: 10px 0 12px;
    font-size: 34px;
    font-weight: 900;
  }

  .price-badge .row-value span {
    font-size: 20px;
    font-weight: 700;
  }

  .badge-box {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #ffffff;
    font-size: 19px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg-photo" src="fundo-gerado-ia.jpg" alt="">
    <div class="bg-shade"></div>

    <img class="bottle" src="foto-garrafa-ambar-cacula.png" alt="Garrafa Âmbar Caçula 600ml">

    <div class="text-block">
      <div class="kicker impact">Cerveja artesanal merece</div>
      <div class="name impact">Garrafa Âmbar <span class="accent">Caçula</span> 600ml</div>
    </div>

    <div class="badge-stack">
      <div class="ref-text">Ref.: 137 - 600 ml</div>
      <div class="price-badge">
        <div class="row-label">A partir de</div>
        <div class="row-value impact">R$ 1,99 <span>un</span></div>
      </div>
      <div class="badge-box">
        <svg width="22" height="22" viewBox="0 0 24 24"><polygon points="12,2 21,7 12,12 3,7" fill="#5aa9c9"/><polygon points="3,7 12,12 12,22 3,17" fill="#2f7ea3"/><polygon points="21,7 12,12 12,22 21,17" fill="#3f92b8"/></svg>
        Caixa c/ 24
      </div>
    </div>
  </div>
</body>
</html>
